<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Virrey Avilés 2763 UF 104</title><script src="https://cdn.tailwindcss.com"></script>
<style>
#ar-bar{position:fixed;left:0;right:0;bottom:44px;z-index:9999;display:flex;justify-content:center;pointer-events:none}
#ar-sw{pointer-events:auto;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.7);color:#fff;padding:6px 11px;border-radius:24px;font:500 12px system-ui}
#ar-t{width:36px;height:20px;border-radius:10px;background:#888;position:relative;border:0}
#ar-t::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .3s}
#ar-t.on{background:#92AECC}#ar-t.on::after{left:19px}
#gal-img{transition:transform .5s ease}#galeria.ar-real{overflow:hidden}#galeria.ar-real #gal-img{transform:scale(2)}
#galeria>button{z-index:9998;text-shadow:0 1px 4px #000}#galeria #gal-num{z-index:9998}
</style></head><body class="bg-black">
<div id="galeria" class="ar-real fixed inset-0 bg-black/95 z-50 flex items-center justify-center">
  <button onclick="mover(-1)" class="absolute left-3 text-white text-4xl px-3">&lsaquo;</button>
  <img id="gal-img" class="max-h-[85vh] max-w-[92vw] object-contain" style="touch-action:pinch-zoom" alt="">
  <button onclick="mover(1)" class="absolute right-3 text-white text-4xl px-3">&rsaquo;</button>
  <p id="gal-num" class="absolute bottom-4 text-white text-sm"></p>
  <div id="ar-bar"><div id="ar-sw"><span>Angular</span><button id="ar-t" class="on" aria-label="Ver como lo ve el ojo"></button><span>Cómo se ve en persona</span></div></div>
</div>
<script>
var FOTOS=["https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844034.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844021.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844058.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844042.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080843947.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080843967.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844015.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844055.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080843941.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080843983.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080843960.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080843992.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844097.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080843977.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844009.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080843953.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844087.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844081.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844094.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844063.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844029.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844102.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844075.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844000.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844049.jpg", "https://imgar.zonapropcdn.com/avisos/resize/1/00/60/24/62/05/1600x1600/2080844069.jpg"],actual=0,galeria=document.getElementById('galeria');
function mover(d){actual=(actual+d+FOTOS.length)%FOTOS.length;pintar()}
function pintar(){document.getElementById('gal-img').src=FOTOS[actual];document.getElementById('gal-num').textContent=(actual+1)+' / '+FOTOS.length}
var t=document.getElementById('ar-t');t.onclick=function(e){e.stopPropagation();galeria.classList.toggle('ar-real',t.classList.toggle('on'))};
var toque0=null;
galeria.addEventListener('touchstart',function(e){if(e.touches.length==1)toque0=e.touches[0].clientX},{passive:true});
galeria.addEventListener('touchend',function(e){if(toque0===null)return;var dx=e.changedTouches[0].clientX-toque0;toque0=null;if(Math.abs(dx)>40)mover(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',function(e){if(e.key=='ArrowRight')mover(1);if(e.key=='ArrowLeft')mover(-1)});
pintar();
</script></body></html>
