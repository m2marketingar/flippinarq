<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- FUERA DE GOOGLE Y FUERA DE LAS IA. Esta pagina no tiene ni un dato adentro, pero igual no
     tiene por que aparecer en ninguna busqueda ni terminar adentro de un modelo. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, max-snippet:0, max-image-preview:none">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">

<title>Flippin ARQ &middot; Tablero</title>
<style>
:root{
  color-scheme: light;
  --marca:#181737; --acento:#6f5ce0; --acento-suave:rgba(111,92,224,.12);
  --plano:#f5f5f7; --superficie:#ffffff;
  --tinta:#1d1d1f; --tinta-2:#6e6e73; --tinta-3:#8e8e93;
  --linea:rgba(0,0,0,.09); --linea-fuerte:rgba(0,0,0,.16);
  --rojo:#c0362c;
  --sombra:0 1px 2px rgba(0,0,0,.04), 0 14px 44px rgba(0,0,0,.09);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--plano);color:var(--tinta);
  font:400 15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px}
.caja{width:100%;max-width:380px;background:var(--superficie);border:1px solid var(--linea);
  border-radius:22px;box-shadow:var(--sombra);padding:34px 30px 26px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:9px;color:var(--marca);margin-bottom:22px}
.logo svg{width:30px;height:30px}
.logo b{font-size:19px;font-weight:600;letter-spacing:-.02em}
.logo i{font-style:normal;font-size:11px;letter-spacing:.22em;color:var(--tinta-3);
  text-transform:uppercase;margin-left:1px}
h1{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.sub{font-size:13.5px;color:var(--tinta-2);margin:0 0 22px;text-wrap:balance}
label{display:block;text-align:left;font-size:12px;color:var(--tinta-3);margin:0 0 5px 3px}
input{width:100%;font:inherit;font-size:16px;padding:11px 13px;margin-bottom:14px;
  border:1px solid var(--linea-fuerte);border-radius:12px;background:var(--superficie);
  color:var(--tinta);transition:border-color .16s ease,box-shadow .16s ease}
input:focus{outline:0;border-color:var(--acento);box-shadow:0 0 0 3.5px var(--acento-suave)}
.conOjo{position:relative}
.conOjo input{padding-right:74px}
.ojo{position:absolute;right:7px;top:6px;width:auto;margin:0;padding:5px 9px;font-size:11.5px;
  font-weight:500;background:transparent;color:var(--tinta-3);border-radius:8px}
.ojo:hover{opacity:1;color:var(--acento);background:var(--acento-suave)}
button{width:100%;font:inherit;font-size:15px;font-weight:600;padding:12px;margin-top:4px;
  border:0;border-radius:12px;background:var(--marca);color:#fff;cursor:pointer;
  transition:opacity .16s ease,transform .16s ease}
button:hover{opacity:.9}
button:active{transform:scale(.985)}
button[disabled]{opacity:.55;cursor:default;transform:none}
.error{font-size:13px;color:var(--rojo);min-height:19px;margin:12px 0 0}
.pie{font-size:11.5px;color:var(--tinta-3);line-height:1.6;margin:22px 0 0;
  padding-top:16px;border-top:1px solid var(--linea);text-wrap:balance}
.temblor{animation:temblar .34s}
@keyframes temblar{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}}
</style>
</head>
<body>
<form class="caja" id="puerta" autocomplete="on">
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 3 3 13.5h3.4V29h19.2V13.5H29z" fill="currentColor"/>
      <path d="M22.2 4.6h4.2v5.2l-4.2-3.3z" fill="#f5c451"/>
    </svg>
    <div><b>flippin</b> <i>ARQ</i></div>
  </div>
  <h1>Tablero de propiedades</h1>
  <p class="sub">Es privado. Entra con el usuario y la contraseña que te pasamos.</p>
  <label for="u">Usuario</label>
  <input id="u" name="username" type="text" autocapitalize="none" autocorrect="off"
         spellcheck="false" autocomplete="username" required>
  <!-- LA CLAVE SE VE POR DEFECTO. Al reves de lo de siempre, y a proposito: esto se abre solo,
       del telefono de Pablo o del de Flippin, y el riesgo de que alguien lea por encima del
       hombro es mucho menor que el de escribirla mal tres veces sin ver que se escribio. El que
       este con gente al lado la tapa de un toque. -->
  <label for="c">Contraseña</label>
  <div class="conOjo">
    <input id="c" name="password" type="password" autocapitalize="none" autocorrect="off"
           spellcheck="false" autocomplete="current-password" required>
    <button class="ojo" id="ojo" type="button" aria-pressed="false"
            aria-label="Ocultar la contraseña">ocultar</button>
  </div>
  <button id="b" type="submit">Entrar</button>
  <p class="error" id="error" role="alert"></p>
  <p class="pie">Documento confidencial. Contiene datos personales de terceros y se entrega en
  forma privada a Flippin ARQ para su uso exclusivo.</p>
</form>

wCvk9C/mQbU8N+GukhwIA/4fJCEekLFoipHFLkvFlb39GWCUx5PyWCAqu9KGkDjr3NiVO7FNuVRATn+rsR6Uvemqv7UU=", VUELTAS = 310000;
  var LLAVERO = "flippin.metricas.clave";

  var f = document.getElementById("puerta"), u = document.getElementById("u"),
      c = document.getElementById("c"), b = document.getElementById("b"),
      error = document.getElementById("error");

  function bytes(s){
    var crudo = atob(s), a = new Uint8Array(crudo.length);
    for(var i = 0; i < crudo.length; i++) a[i] = crudo.charCodeAt(i);
    return a;
  }

  /* HACE FALTA HTTPS, y si no lo hay se dice en vez de fallar callado. crypto.subtle solamente
     existe en un contexto seguro: por https anda, abriendo el archivo del disco no. */
  if(!window.crypto || !crypto.subtle){
    error.textContent = "Abri esta pagina con https:// para poder entrar.";
    b.disabled = true;
    return;
  }

  function abrir(usuario, clave, callado){
    b.disabled = true;
    b.textContent = "Entrando\u2026";
    error.textContent = "";
    /* LA CLAVE NO DISTINGUE MAYUSCULAS. Lo pidio Pablo el 21/09/2026: una clave que se pasa por
       mensaje y se escribe en un telefono, donde el teclado pone la primera en mayuscula solo, se
       rechaza por eso y por nada mas. El que la tiene, la tiene; hacerlo fallar por una letra es
       una mala experiencia y ninguna seguridad. El usuario ya venia asi. */
    var texto = new TextEncoder().encode(usuario + ":" + clave.trim().toLowerCase());
    return crypto.subtle.importKey("raw", texto, "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return crypto.subtle.deriveKey(
          {name:"PBKDF2", salt:bytes(SAL), iterations:VUELTAS, hash:"SHA-256"},
          base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      })
      .then(function(llave){
        return crypto.subtle.decrypt({name:"AES-GCM", iv:bytes(NONCE)}, llave, bytes(BULTO));
      })
      .then(function(plano){
        /* SE GUARDA LA CLAVE EN ESTE TELEFONO PARA NO PEDIRLA TODOS LOS DIAS. No baja la
           seguridad de nada: el que tenga el telefono desbloqueado ya estaba adentro. */
        try{ localStorage.setItem(LLAVERO, JSON.stringify([usuario, clave])); }catch(e){}
        var html = new TextDecoder().decode(plano);
        document.open(); document.write(html); document.close();
      })
      .catch(function(){
        try{ localStorage.removeItem(LLAVERO); }catch(e){}
        b.disabled = false;
        b.textContent = "Entrar";
        if(!callado){
          error.textContent = "Usuario o contraseña incorrectos.";
          f.classList.remove("temblor");
          void f.offsetWidth;
          f.classList.add("temblor");
          c.value = ""; c.focus();
        }
      });
  }

  var ojo = document.getElementById("ojo");
  /* NACE COMO CAMPO DE CLAVE Y RECIEN AHI SE DESTAPA. Parece un rodeo y no lo es: si el input
     arranca como texto, el navegador no reconoce el formulario como uno de login y no ofrece
     guardar la contrasena nunca mas. Se deja que la vea escrita, que es lo que Pablo pidio, pero
     el navegador ya la fichó como clave. */
  c.type = "text";
  ojo.addEventListener("click", function(){
    var tapada = c.type === "password";
    c.type = tapada ? "text" : "password";
    ojo.textContent = tapada ? "ocultar" : "ver";
    ojo.setAttribute("aria-pressed", tapada ? "false" : "true");
    ojo.setAttribute("aria-label", (tapada ? "Ocultar" : "Ver") + " la contraseña");
    c.focus();
  });

  f.addEventListener("submit", function(e){
    e.preventDefault();
    abrir(u.value.trim().toLowerCase(), c.value, false);
  });

  /* SI YA ENTRARON UNA VEZ DESDE ESTE TELEFONO, ENTRAN SOLOS. Es lo que hace que la clave no se
     transforme en una molestia diaria y que nadie deje de mirar el tablero por eso. */
  var guardado = null;
  try{ guardado = JSON.parse(localStorage.getItem(LLAVERO) || "null"); }catch(e){}
  if(guardado && guardado.length === 2){
    u.value = guardado[0];
    abrir(guardado[0], guardado[1], true);
  }else{
    u.focus();
  }
})();
